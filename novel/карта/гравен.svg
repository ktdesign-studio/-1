    <rect x="580" y="572" width="64" height="108" fill="#2a3245" stroke="#5a6478"/>
    <rect x="652" y="596" width="56" height="84" fill="#262e40" stroke="#5a6478"/>
    <rect x="716" y="580" width="60" height="100" fill="#2a3245" stroke="#5a6478"/>
    <g fill="#cfe3ff">
