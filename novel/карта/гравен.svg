<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="1560" viewBox="0 0 1100 1560">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1c2433"/>
      <stop offset="0.35" stop-color="#161d2a"/>
      <stop offset="0.62" stop-color="#10222a"/>
      <stop offset="1" stop-color="#06090f"/>
    </linearGradient>
    <linearGradient id="fog" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#b8d8c8" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#b8d8c8" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#b8d8c8" stop-opacity="0.55"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#9fe3c9" stop-opacity="0.8"/>
      <stop offset="1" stop-color="#9fe3c9" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="heart" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffb46a" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#ffb46a" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1100" height="1560" fill="url(#bg)"/>

  <!-- title -->
  <text x="550" y="58" text-anchor="middle" font-family="DejaVu Serif" font-size="38" fill="#e8e2d0" letter-spacing="6">ГРАВЕН</text>
  <text x="550" y="88" text-anchor="middle" font-family="DejaVu Serif" font-size="16" fill="#9aa3b2" font-style="italic">город по вертикали · схема к роману «Город, который забирает»</text>
  <line x1="180" y1="104" x2="920" y2="104" stroke="#5a6478" stroke-width="1"/>

  <!-- ════════ ВЕРХНИЙ ГРАВЕН ════════ -->
  <text x="65" y="190" font-family="DejaVu Serif" font-size="20" fill="#d8c890" letter-spacing="3">ВЕРХНИЙ ГРАВЕН</text>
  <text x="65" y="212" font-family="DejaVu Serif" font-size="13" fill="#8a93a2" font-style="italic">кварталы на сваях · свет всегда ровный</text>

  <!-- dirigible -->
  <g>
    <ellipse cx="850" cy="150" rx="85" ry="26" fill="#3a4254" stroke="#5a6478" stroke-width="1.5"/>
    <rect x="825" y="172" width="50" height="14" rx="4" fill="#2a3142" stroke="#5a6478"/>
    <line x1="838" y1="172" x2="830" y2="160" stroke="#5a6478"/>
    <line x1="862" y1="172" x2="870" y2="160" stroke="#5a6478"/>
    <text x="850" y="130" text-anchor="middle" font-family="DejaVu Serif" font-size="12" fill="#8a93a2" font-style="italic">дирижабельные причалы</text>
  </g>

  <!-- upper platforms on stilts -->
  <g stroke="#4a5468" stroke-width="3" fill="none">
    <line x1="300" y1="330" x2="300" y2="430"/>
    <line x1="370" y1="330" x2="370" y2="430"/>
    <line x1="560" y1="330" x2="560" y2="430"/>
    <line x1="640" y1="330" x2="640" y2="430"/>
    <line x1="330" y1="430" x2="340" y2="330"/>
    <line x1="600" y1="430" x2="610" y2="330"/>
  </g>
  <rect x="265" y="320" width="150" height="12" fill="#4a5468"/>
  <rect x="525" y="320" width="160" height="12" fill="#4a5468"/>
  <!-- bridge between platforms -->
  <path d="M 415 326 Q 470 300 525 326" stroke="#4a5468" stroke-width="6" fill="none"/>

  <!-- биржа эфира -->
  <g>
    <rect x="285" y="240" width="110" height="80" fill="#2e3648" stroke="#5a6478"/>
    <polygon points="285,240 340,205 395,240" fill="#39425a" stroke="#5a6478"/>
    <g fill="#ffd87a">
      <rect x="298" y="255" width="10" height="14"/><rect x="318" y="255" width="10" height="14"/>
      <rect x="338" y="255" width="10" height="14"/><rect x="358" y="255" width="10" height="14"/>
      <rect x="298" y="285" width="10" height="14"/><rect x="318" y="285" width="10" height="14"/>
      <rect x="338" y="285" width="10" height="14"/><rect x="358" y="285" width="10" height="14"/>
      <rect x="378" y="255" width="8" height="14"/><rect x="378" y="285" width="8" height="14"/>
    </g>
    <text x="340" y="350" text-anchor="middle" font-family="DejaVu Serif" font-size="14" fill="#d8c890">биржа эфира</text>
  </g>

  <!-- мастерские при бирже -->
  <g>
    <rect x="540" y="262" width="130" height="58" fill="#2e3648" stroke="#5a6478"/>
    <rect x="556" y="232" width="14" height="30" fill="#2e3648" stroke="#5a6478"/>
    <g fill="#ffd87a">
      <rect x="552" y="276" width="9" height="12"/><rect x="572" y="276" width="9" height="12"/>
      <rect x="592" y="276" width="9" height="12"/><rect x="612" y="276" width="9" height="12"/>
      <rect x="632" y="276" width="9" height="12"/><rect x="652" y="276" width="9" height="12"/>
    </g>
    <text x="605" y="350" text-anchor="middle" font-family="DejaVu Serif" font-size="14" fill="#d8c890">мастерские (клеймо · У5)</text>
  </g>
  <text x="790" y="300" font-family="DejaVu Serif" font-size="12" fill="#b8a76a" font-style="italic">окна не мерцают</text>
  <text x="790" y="316" font-family="DejaVu Serif" font-size="12" fill="#b8a76a" font-style="italic">в часы голода (У4)</text>

  <!-- ════════ СРЕДИННЫЙ ГОРОД ════════ -->
  <line x1="60" y1="445" x2="1040" y2="445" stroke="#5a6478" stroke-width="1" stroke-dasharray="6 5"/>
  <text x="65" y="478" font-family="DejaVu Serif" font-size="20" fill="#c9d2e0" letter-spacing="3">СРЕДИННЫЙ ГОРОД</text>
  <text x="65" y="500" font-family="DejaVu Serif" font-size="13" fill="#8a93a2" font-style="italic">эфир по талонам · фонари через два на третий</text>

  <!-- Восточная башня -->
  <g>
    <polygon points="940,720 960,470 1000,470 1020,720" fill="#2a3245" stroke="#5a6478" stroke-width="1.5"/>
    <ellipse cx="980" cy="470" rx="20" ry="8" fill="#39425a" stroke="#5a6478"/>
    <ellipse cx="980" cy="455" rx="9" ry="20" fill="url(#glow)"/>
    <line x1="952" y1="560" x2="1008" y2="560" stroke="#5a6478"/>
    <line x1="948" y1="630" x2="1012" y2="630" stroke="#5a6478"/>
    <text x="980" y="745" text-anchor="middle" font-family="DejaVu Serif" font-size="13" fill="#c9d2e0">Восточная</text>
    <text x="980" y="762" text-anchor="middle" font-family="DejaVu Serif" font-size="13" fill="#c9d2e0">башня</text>
    <text x="980" y="780" text-anchor="middle" font-family="DejaVu Serif" font-size="11" fill="#8a93a2" font-style="italic">(Дан · баки без клейма)</text>
  </g>

  <!-- управа -->
  <g>
    <rect x="120" y="560" width="150" height="120" fill="#2a3245" stroke="#5a6478"/>
    <polygon points="120,560 195,525 270,560" fill="#343d52" stroke="#5a6478"/>
    <rect x="186" y="640" width="22" height="40" fill="#1a2130"/>
    <g fill="#cfe3ff" opacity="0.85">
      <rect x="136" y="580" width="9" height="13"/><rect x="176" y="580" width="9" height="13"/>
      <rect x="216" y="580" width="9" height="13"/><rect x="246" y="580" width="9" height="13"/>
      <rect x="136" y="612" width="9" height="13" opacity="0.3"/><rect x="216" y="612" width="9" height="13"/>
    </g>
    <!-- полуподвальное окно архива -->
    <rect x="140" y="664" width="26" height="10" fill="#9fe3c9" opacity="0.7"/>
    <text x="195" y="700" text-anchor="middle" font-family="DejaVu Serif" font-size="14" fill="#c9d2e0">управа межевания</text>
    <text x="195" y="716" text-anchor="middle" font-family="DejaVu Serif" font-size="11" fill="#8a93a2" font-style="italic">архив Теи — в полуподвале</text>
  </g>

  <!-- сборная площадь + сыск -->
  <g>
    <rect x="330" y="588" width="120" height="92" fill="#2a3245" stroke="#5a6478"/>
    <rect x="372" y="556" width="36" height="32" fill="#2a3245" stroke="#5a6478"/>
    <g fill="#cfe3ff" opacity="0.8">
      <rect x="344" y="604" width="9" height="13"/><rect x="384" y="604" width="9" height="13" opacity="0.3"/>
      <rect x="424" y="604" width="9" height="13"/>
    </g>
    <text x="390" y="700" text-anchor="middle" font-family="DejaVu Serif" font-size="14" fill="#c9d2e0">сыскное управление</text>
    <text x="390" y="716" text-anchor="middle" font-family="DejaVu Serif" font-size="11" fill="#8a93a2" font-style="italic">Ройс · камера с выжженным туманом</text>
    <!-- memorial -->
    <rect x="520" y="600" width="10" height="40" fill="#4a5468"/>
    <rect x="508" y="592" width="34" height="10" fill="#4a5468"/>
    <text x="525" y="660" text-anchor="middle" font-family="DejaVu Serif" font-size="12" fill="#c9d2e0">Сборная пл.</text>
    <text x="525" y="675" text-anchor="middle" font-family="DejaVu Serif" font-size="11" fill="#8a93a2" font-style="italic">доска о «пожаре»</text>
  </g>

  <!-- жилые кварталы: Свечной, Жестяная -->
